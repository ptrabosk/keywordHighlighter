<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deterministic Rule Labeler</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../highlighter/icons/icon16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../highlighter/icons/icon32.png">
  <link rel="stylesheet" href="labeling-site.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Deterministic rules</p>
        <h1>Rule Labeler</h1>
      </div>
      <div class="progress" aria-live="polite">
        <strong id="reviewedCount">0</strong>
        <span id="totalCount">of 0 reviewed</span>
      </div>
    </header>

    <details class="filter-panel" open>
      <summary>
        <span>Search</span>
        <span id="filterSummary">All rules</span>
      </summary>
      <section class="toolbar" aria-label="Rule filters">
        <label class="search-field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Rule id, name, pattern, example">
        </label>
        <label>
          <span>Reviewed</span>
          <select id="reviewFilter">
            <option value="all">All</option>
            <option value="unchecked">Unchecked</option>
            <option value="checked">Checked</option>
          </select>
        </label>
        <label>
          <span>Category</span>
          <select id="categoryFilter"></select>
        </label>
        <label>
          <span>Subcategory</span>
          <select id="subcategoryFilter"></select>
        </label>
        <label>
          <span>Action</span>
          <select id="actionFilter"></select>
        </label>
        <button id="exportButton" type="button">Export JSON</button>
      </section>
    </details>

    <section class="content">
      <div id="statusLine" class="status-line">Loading rules...</div>
      <div id="ruleList" class="rule-list"></div>
    </section>
  </main>

  <script src="labeling-site.js"></script>
</body>
</html>
