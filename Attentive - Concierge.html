      min-height: 100%;
      width: 100%;
    }
    .unsupported-browser #app {
      display: block;
      padding-top: 20%;
      text-align: center;
      height: auto;
      min-height: 0;
    }
    .unsupported-browser #app p {
      padding: 16px;
      border-radius: 4px;
      background-color: #F8E6B1;
      display: inline-block;
      min-width: 70%;
    }
    .loader {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    .error-loading-content {
      display: flex;
      place-content: center;
      place-items: center;
      width: 100vw;
      height: 100vh;
    }
    .loader > div {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: Helvetica, sans-serif;
    }
    /* AppLoading Loading Indicator - matches Picnic LoadingIndicator component */
    .app-loading {
      display: flex;
      place-items: center;
      place-content: center;
      text-align: center;
      flex: 1;
      font-family: Helvetica, sans-serif;
      font-weight: 400;
      letter-spacing: normal;
    }
    .app-loading__indicator {
      display: inline-flex;
      align-items: center;
      height: 1em;
      color: #1B1F23;
    }
    .app-loading__dot {
      box-sizing: content-box;
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 9999px;
      border-width: 2px;
      border-style: solid;
      border-color: currentColor;
    }
    .app-loading__dot--2 {
      margin: 0 8px;
    }
    .app-loading__visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    @keyframes app-loading-pulsate {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0;
      }
    }
    .app-loading__dot--1 {
      animation: app-loading-pulsate 1000ms ease-in-out infinite;
    }
    .app-loading__dot--2 {
      animation: app-loading-pulsate 1000ms ease-in-out infinite 300ms;
    }
    .app-loading__dot--3 {
      animation: app-loading-pulsate 1000ms ease-in-out infinite 600ms;
    }
  </style>
