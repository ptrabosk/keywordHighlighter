<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rule Highlighter Demo</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../highlighter/icons/icon16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../highlighter/icons/icon32.png">
  <link rel="apple-touch-icon" href="../highlighter/icons/icon128.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../highlighter/content.css">
  <link rel="stylesheet" href="test-site.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Extension demo</p>
        <h1>Rule Highlighter Demo</h1>
        <p class="muted">Add a message or browse generated examples. Hover highlighted text to see the rule guidance.</p>
      </div>
    </header>

    <section class="filters" aria-label="Message filters">
      <label>
        <span>Category</span>
        <select id="categoryFilter"></select>
      </label>
      <label>
        <span>Subcategory</span>
        <select id="subcategoryFilter"></select>
      </label>
      <label>
        <span>Action</span>
        <select id="actionFilter"></select>
      </label>
    </section>

    <section class="layout">
      <aside class="sidebar" aria-label="Custom messages">
        <div class="sidebar-head">
          <h2>Custom messages</h2>
          <span id="customCount">0 added</span>
        </div>
        <section class="composer" aria-label="Add a message">
          <label>
            <span>Message</span>
            <textarea id="messageInput" rows="4" placeholder="Type an inbound customer message"></textarea>
          </label>
          <button id="addMessage" type="button">Add message</button>
        </section>
        <div id="customList" class="custom-list"></div>
      </aside>

      <section class="workspace" aria-label="Messages">
        <div id="messageDeck" class="message-deck"></div>
      </section>
    </section>
  </main>

  <script src="test-site.js"></script>
</body>
</html>
