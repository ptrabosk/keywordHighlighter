<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attentive Rule Highlighter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Concierge Highlighter</p>
      <h1>Custom Keywords</h1>
      <p class="subtle">Add words or phrases to highlight alongside Concierge rules.</p>

      <form id="keywordForm" class="keyword-form">
        <label class="field" for="keywordInput">
          <span>Keyword</span>
          <input id="keywordInput" type="text" autocomplete="off" spellcheck="false" maxlength="128" placeholder="STOP">
        </label>
        <label class="field" for="keywordText">
          <span>Hover text</span>
          <input id="keywordText" type="text" autocomplete="off" spellcheck="true" maxlength="256" placeholder="Reminder text">
        </label>
        <button id="addKeyword" type="submit" class="primary">ADD KEYWORD</button>
      </form>

      <div id="keywords" class="keywords" aria-live="polite"></div>
      <div class="backup-actions">
        <button id="exportKeywords" type="button" class="secondary">Export</button>
        <button id="importKeywords" type="button" class="secondary">Import</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>

    </section>

    <footer class="actions">
      <span id="status" role="status"></span>
    </footer>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
